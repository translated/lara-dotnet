name: Publish package to NuGet

on:
  workflow_dispatch:
  push:
    tags:
      - v*

jobs:
  publish:
    name: Publish package to NuGet
    runs-on: ubuntu-latest
    environment: release
    
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Lara.Sdk/Lara.Sdk.csproj

      - name: Build
        run: dotnet build src/Lara.Sdk/Lara.Sdk.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Lara.Sdk/Lara.Sdk.csproj --configuration Release --no-build --output nupkgs

        # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
    
      # Push the package
      - name: NuGet push
        run: dotnet nuget push nupkgs/*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
